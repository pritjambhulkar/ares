<!DOCTYPE html>
<html>
<head>
<title>Checkout</title>

<style>
body {
    background: #081c15;
    color: white;
    font-family: Poppins;
}

.container {
    width: 40%;
    margin: 50px auto;
    background: rgba(255,255,255,0.05);
    padding: 30px;
    border-radius: 20px;
}

input, select {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border-radius: 10px;
    border: none;
}

button {
    width: 100%;
    padding: 12px;
    background: #2d6a4f;
    color: white;
    border: none;
    border-radius: 20px;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
}

</style>

</head>

<body>

<div class="container">
<h2>🧾 Checkout</h2>

<form method="POST" action="/place_order">

<input type="text" name="name" placeholder="Full Name" required>
<input type="text" name="address" placeholder="Address" required>
<input type="text" name="phone" placeholder="Phone" required>

<h3>🔒 Secure Checkout</h3>
<p style="opacity:0.6;">Your data is protected</p>


<h3>Payment</h3>

<select name="payment">
    <option value="Cash on Delivery">Cash on Delivery</option>
    <option value="UPI">UPI</option>
    <option value="Card">Debit/Credit Card</option>
</select>

<button type="submit">Place Order</button>

</form>
</div>

</body>
</html>
